name: CI Preflight
description: Prepara el entorno de CI resolviendo la versin de Node desde un archivo del reposiorio

inputs:
  node-version-file:
    description: Ruta relativa al archivo que declara la version de Node
    required: false
    default: .nvmrc

  working-directory:
    description: Directorio base desde el cual resolver rutas relativas
    required: false
    # '.' significa la raiz del workspace del consumidor, no la de la action.
    default: '.'

runs:
  using: composite
  steps:
    - name: Resolver version de Node
      id: resolve
      shell: bash
      # `set -euo pipefail` no es decorativo:
      #   -e          aborta ante el primer comando que falle
      #   -u          aborta si se usa una variable no definida
      #   -o pipefail hace que una tuberia falle si falla cualquier eslabon
      # Sin eto, un `cat`de un archivo inexistente imprime error y CONTINUA,
      # y la action reportaria exito con un valor vacio.
      run: |
        set -euo pipefail

        cd "${{inputs.working-directory}}"
        FILE="${{inputs.node-version-file}}"

        if [[ ! -f "$FILE" ]]; then
          # Mensaje accionable: dice que falta, donde lo busco y como arreglarlo.
          echo "::error title=Archivo de version no encontrado::No existe '$FILE' en '$(pwd)'. Crealo con: echo 24 > $FILE"
          exit 1
        fi

        # tr elimina espacios, tabs, saltos de linea y un posible \r de Windows.
        # Un .nvmrc con salto de linea final no es normal, y sin esto la version
        # resuelta seria "24\n", que setup-node rechaza con un error confuso.
        VERSION="$(tr -d '[:space:]' < "$FILE")"

        if [[ -z "$VERSION" ]]; then
          echo "::error title=Archivo de version vacio::'$FILE' existe pero no contiene una version"
          exit 1
        fi

        echo "Version resuelta: $VERSION (desde $FILE)"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Instalar Node
      uses: actions/setup-node@v7
      with:
        # Consumimos el output del step anterior por su 'id'.
        node-version: ${{steps.resolve.outputs.version}}
        # Apagado a proposito del cache. Se manejara por nuestra cuenta posteriormente.
        # setup-node v7 lo activa por defecto.
        package-manager-cache: false

    - name: Confirmar version instalada
      shell: bash
      run: |
        set -euo pipefail
        echo "node: $(node --version)"
        echo "npm: $(npm --version)"





